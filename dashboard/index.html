<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R.A.M.A. Mission Console</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #17324d; }
    .card { border: 1px solid #d7e1ea; border-radius: 12px; padding: 20px; margin: 16px 0; }
    button { background: #1264a3; color: white; border: 0; border-radius: 6px; padding: 10px 14px; cursor: pointer; }
    pre { background: #f4f7fa; padding: 12px; overflow: auto; }
    #map { height: 420px; border-radius: 12px; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .metric { background: #f4f7fa; padding: 12px; border-radius: 8px; }
    .metric strong { display: block; font-size: 1.3rem; }
  </style>
</head>
<body>
  <h1>R.A.M.A. Mission Console</h1>
  <p>Simulation dashboard for route validation, autonomy, and return-to-base safety.</p>
  <div class="card">
    <h2>New simulated mission</h2>
    <label>Name <input id="name" value="Area 001"></label>
    <label>Route points <input id="route" value="0.001,0.001;0.002,0.002"></label>
    <button id="create">Create mission</button>
  </div>
  <div class="card">
    <button id="refresh">Refresh missions</button>
    <button id="start">Start selected</button>
    <button id="pause">Pause selected</button>
    <button id="resume">Resume selected</button>
    <button id="abort">Abort selected</button>
    <pre id="missions">No missions loaded.</pre>
  </div>
  <div class="card">
    <h2>Flight status</h2>
    <div class="metrics">
      <div class="metric">State<strong id="state">--</strong></div>
      <div class="metric">Battery<strong id="battery">--</strong></div>
      <div class="metric">Position<strong id="position">--</strong></div>
      <div class="metric">Alerts<strong id="alert-count">0</strong></div>
    </div>
    <pre id="events">No events loaded.</pre>
  </div>
  <div class="card"><div id="map"></div></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-23.55, -46.63], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
    let selectedMission = null;
    let missionLayers = [];
    const drone = {id: 'dashboard-drone', name: 'Dashboard Simulator', percent_per_km: 20, reserve_percent: 12, emergency_percent: 8};
    const base = {latitude: -23.55, longitude: -46.63, altitude_m: 0};
    async function api(path, method = 'GET', body = undefined) {
      const response = await fetch(path, {method, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'Request failed');
      return data;
    }
    document.querySelector('#create').onclick = async () => {
      const route = document.querySelector('#route').value.split(';').map(pair => { const [lat, lon] = pair.split(',').map(Number); return {latitude: base.latitude + lat, longitude: base.longitude + lon, altitude_m: 100}; });
      selectedMission = (await api('/missions', 'POST', {name: document.querySelector('#name').value, base, route, initial_battery_percent: 90, drone})).id;
      await refresh();
    };
    async function refresh() {
      const missions = await api('/missions');
      document.querySelector('#missions').textContent = JSON.stringify(missions, null, 2);
      missionLayers.forEach(layer => map.removeLayer(layer)); missionLayers = [];
      missions.forEach(item => {
        try { const payload = JSON.parse(item.payload); const points = payload.plan.route.map(p => [p.latitude, p.longitude]); if (points.length) missionLayers.push(L.polyline(points, {color: '#1264a3'}).addTo(map)); } catch (_) {}
      });
    }
    async function refreshFlightStatus() {
      if (!selectedMission) return;
      try {
        const telemetry = await api(`/missions/${selectedMission}/telemetry`);
        const latest = telemetry[telemetry.length - 1];
        document.querySelector('#battery').textContent = `${Number(latest.battery_percent).toFixed(1)}%`;
        document.querySelector('#position').textContent = `${Number(latest.position.latitude).toFixed(5)}, ${Number(latest.position.longitude).toFixed(5)}`;
        const mission = await api(`/missions/${selectedMission}`);
        document.querySelector('#state').textContent = mission.state;
        const alerts = await api(`/missions/${selectedMission}/alerts`);
        document.querySelector('#alert-count').textContent = alerts.length;
        document.querySelector('#events').textContent = JSON.stringify(await api(`/missions/${selectedMission}/events`), null, 2);
      } catch (_) { /* The mission may not have started yet. */ }
    }
    document.querySelector('#refresh').onclick = async () => {
      await refresh();
    };
    document.querySelector('#start').onclick = () => selectedMission && api(`/missions/${selectedMission}/start`, 'POST');
    document.querySelector('#pause').onclick = () => selectedMission && api(`/missions/${selectedMission}/pause`, 'POST');
    document.querySelector('#resume').onclick = () => selectedMission && api(`/missions/${selectedMission}/resume`, 'POST');
    document.querySelector('#abort').onclick = () => selectedMission && api(`/missions/${selectedMission}/abort`, 'POST');
    setInterval(refreshFlightStatus, 1000);
  </script>
</body>
</html>
